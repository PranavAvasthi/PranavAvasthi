<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="416" viewBox="0 0 1280 416" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pranav Avasthi — Web and mobile, carefully built</title>
  <desc id="desc">Software Engineer III at GeekyAnts. A warm orange sun, an orbital path, and a constellation shaped like the letter P. The slow animation respects reduced motion preferences.</desc>
  <defs>
    <linearGradient id="sky" x1="32" y1="0" x2="1216" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101E2D" />
      <stop offset="0.57" stop-color="#0A131F" />
      <stop offset="1" stop-color="#17202D" />
    </linearGradient>
    <radialGradient id="dusk" cx="0" cy="0" r="1" gradientTransform="translate(1006 346) rotate(-90) scale(280 460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6238" stop-opacity="0.19" />
      <stop offset="0.58" stop-color="#FF6238" stop-opacity="0.045" />
      <stop offset="1" stop-color="#FF6238" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientTransform="translate(972 189) rotate(54) scale(112)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7B9" />
      <stop offset="0.5" stop-color="#FFAE73" />
      <stop offset="1" stop-color="#FF6238" />
    </radialGradient>
    <linearGradient id="orbit" x1="786" y1="172" x2="1196" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBA8A" stop-opacity="0.1" />
      <stop offset="0.58" stop-color="#FFB886" stop-opacity="0.75" />
      <stop offset="1" stop-color="#FF6238" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="rule" x1="56" y1="0" x2="1224" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#697988" stop-opacity="0.4" />
      <stop offset="0.58" stop-color="#697988" stop-opacity="0.14" />
      <stop offset="0.82" stop-color="#FF9C70" stop-opacity="0.5" />
      <stop offset="1" stop-color="#FF9C70" stop-opacity="0.06" />
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="414" rx="24" /></clipPath>
    <filter id="halo" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .satellite-static { display: none; }
    .constellation { stroke-dasharray: 312; stroke-dashoffset: 0; animation: trace 2.8s ease-out both; }
    .star-a { animation: breathe 7s ease-in-out infinite; }
    .star-b { animation: breathe 9s 2s ease-in-out infinite; }
    @keyframes trace { from { stroke-dashoffset: 312; opacity: 0.1; } to { stroke-dashoffset: 0; opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) {
      .constellation, .star-a, .star-b { animation: none !important; }
      .satellite { display: none; }
      .satellite-static { display: inline; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="416" fill="url(#sky)" />
    <rect width="1280" height="416" fill="url(#dusk)" />

    <!-- Distant points: deliberately sparse, with no flashing or moving copy. -->
    <g fill="#B5C8DC">
      <circle cx="726" cy="74" r="1.2" opacity="0.35" />
      <circle cx="858" cy="95" r="1" opacity="0.45" />
      <circle class="star-a" cx="1135" cy="98" r="1.9" opacity="0.6" />
      <circle cx="1186" cy="291" r="1" opacity="0.35" />
      <circle cx="693" cy="218" r="0.8" opacity="0.3" />
      <circle cx="754" cy="304" r="1" opacity="0.3" />
      <circle class="star-b" cx="1071" cy="74" r="1.4" opacity="0.5" />
      <circle cx="1211" cy="151" r="0.9" opacity="0.35" />
      <circle cx="893" cy="334" r="1.2" opacity="0.4" />
      <circle cx="672" cy="135" r="1" opacity="0.23" />
    </g>

    <!-- Identity stays readable from the first frame. -->
    <rect x="56" y="48" width="6" height="6" rx="1" fill="#FF784E" />
    <text x="76" y="57" class="mono" font-size="13" letter-spacing="2.4" fill="#BCC9D4">WEB &amp; MOBILE / ENGINEERING</text>
    <text x="50" y="170" class="sans" font-size="92" font-weight="650" letter-spacing="-5" fill="#F5F1EB">Pranav</text>
    <text x="50" y="263" class="sans" font-size="92" font-weight="650" letter-spacing="-5" fill="#F5F1EB">Avasthi<tspan fill="#FF784E">.</tspan></text>
    <text x="56" y="309" class="sans" font-size="20" fill="#B8C6D4">Software Engineer III <tspan fill="#64798E"> / </tspan> GeekyAnts</text>

    <!-- A sun at the point where a technical orbit meets a human interface. -->
    <g id="celestial-mark">
    <circle cx="994" cy="230" r="111" stroke="#61748A" stroke-opacity="0.12" />
    <circle cx="994" cy="230" r="88" stroke="#61748A" stroke-opacity="0.1" />
    <path d="M806 278C801 237 888 185 993 163C1098 141 1187 157 1192 198C1197 239 1110 291 1005 313C900 335 811 319 806 278Z" stroke="url(#orbit)" stroke-width="1.2" />
    <circle cx="994" cy="230" r="61" fill="url(#sun)" />
    <path d="M936 249C969 234 1010 221 1054 216" stroke="#FFF3D9" stroke-opacity="0.2" />
    <path d="M940 256C976 241 1014 228 1055 223" stroke="#FFF3D9" stroke-opacity="0.11" />
    <path d="M1192 198C1197 239 1110 291 1005 313C900 335 811 319 806 278" stroke="url(#orbit)" stroke-width="1.25" />
    <g transform="translate(806 278)">
      <g class="satellite">
        <circle r="9" fill="#FF956A" opacity="0.5" filter="url(#halo)" />
        <circle r="3.4" fill="#FFE4C1" />
        <animateMotion dur="24s" repeatCount="indefinite" calcMode="paced" path="M0 0C-5-41 82-93 187-115C292-137 381-121 386-80C391-39 304 13 199 35C94 57 5 41 0 0Z" />
      </g>
      <circle class="satellite-static" r="3.4" fill="#FFE4C1" />
    </g>

    <!-- The P constellation is a personal mark, rather than a stock illustration. -->
    <path class="constellation" d="M762 231V122L816 110L848 139L823 171L762 178" stroke="#B9CEE1" stroke-opacity="0.46" stroke-width="1.2" />
    <g fill="#D4E4F2">
      <circle cx="762" cy="231" r="2.4" />
      <circle cx="762" cy="122" r="3" />
      <circle cx="816" cy="110" r="2.4" />
      <circle cx="848" cy="139" r="2.5" />
      <circle cx="823" cy="171" r="2.4" />
      <circle cx="762" cy="178" r="2.3" />
    </g>
    <circle class="star-a" cx="762" cy="122" r="7" stroke="#D4E4F2" stroke-opacity="0.25" />
    </g>

    <path d="M56 348H1224" stroke="url(#rule)" />
    <text x="56" y="383" class="sans" font-size="17" fill="#D6DFE7">Web &amp; mobile. <tspan fill="#FFAD82">Carefully built.</tspan></text>
    <text x="1224" y="382" text-anchor="end" class="mono" font-size="11" letter-spacing="2" fill="#8EA1B5">THOUGHTFUL BY DESIGN</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="415" rx="24" stroke="#8AA1B9" stroke-opacity="0.15" />
</svg>
